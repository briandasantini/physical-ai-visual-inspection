site_name: Physical AI Visual Inspection Workshop
site_description: Explore vision-language model behavior, inspection requirements, and data needs on physical workspace images.
site_url: https://briandasantini.github.io/physical-ai-visual-inspection/
repo_url: https://github.com/briandasantini/physical-ai-visual-inspection
repo_name: briandasantini/physical-ai-visual-inspection

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: custom
      accent: custom

nav:
  - Start Here: index.md
  - Launch the Environment: launch.md
  - Cosmos Models: models.md
  - Workshop:
      - Workshop Map: workshop/index.md
      - 1. First Examples: workshop/first-examples.md
      - 2. Larger Set: workshop/larger-set.md
      - Understand Contour Cues: workshop/contours.md
      - 3. Explore with Codex/Claude: workshop/explore.md
  - Work With an Agent: agents.md
  - Use the CLI: cli.md
  - Reference:
      - Architecture: reference/architecture.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

copyright: Workshop code is available under the Apache License 2.0.
