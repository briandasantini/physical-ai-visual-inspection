name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install --requirement app/requirements.txt
      - run: PYTHONPATH=app/src python -m unittest discover -s app/tests -p 'test_*.py'
      - run: PYTHONPATH=app/src python -c 'from visual_inspection.ui import build_demo; build_demo()'
      - run: bash -n setup.sh scripts/*.sh vision-inspect
